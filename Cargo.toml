[package]
name = "mmf"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.35.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }
futures = "0.3.34"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
